services:
  - type: web
    name: b48-personal-web
    runtime: docker
    plan: free
    region: singapore
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: b48-postgres
          property: connectionString

databases:
  - name: b48-postgres
    plan: free
    region: singapore
    databaseName: postgres
    user: postgres
