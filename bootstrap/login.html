<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Wahyu Febri Tamtomo</title>
  <link rel="icon" type="image/x-icon" href="/assets/dp.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            canvas: '#09090b',
            surface: '#121215',
            'surface-elevated': '#18181b',
            emerald: {
              400: '#34d399',
              500: '#10b981',
              600: '#059669',
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="/css/modern.css">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <!-- 3D WebGL & Animation Engines -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.1/vanilla-tilt.min.js"></script>
  <script src="/script/interactive-3d.js" defer></script>
</head>
<body class="bg-canvas text-zinc-100 selection:bg-emerald-500/20 selection:text-emerald-300 min-h-screen flex items-center justify-center p-6 relative">
  <div id="canvas3d-bg"></div>


  <div class="ambient-glow top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2"></div>

  <div class="glass-panel rounded-3xl p-8 sm:p-10 w-full max-w-md border border-white/10 shadow-2xl relative z-10">
    <div class="text-center mb-8">
      <a href="/" class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-gradient-to-tr from-emerald-500 to-teal-400 p-[1px] mb-4 group">
        <div class="w-full h-full bg-zinc-950 rounded-2xl flex items-center justify-center font-bold text-sm text-emerald-400 group-hover:scale-105 transition-transform">
          WZ
        </div>
      </a>
      <h1 class="text-2xl font-extrabold text-zinc-100 tracking-tight">Welcome Back</h1>
      <p class="text-xs text-zinc-400 mt-1">Sign in to manage projects and published blogs.</p>
    </div>

    <form action="/sign-in" method="POST" class="space-y-4">
      <div>
        <label for="Username" class="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-1.5">Username</label>
        <input type="text" id="Username" name="Username" required placeholder="Your username" class="form-input" />
      </div>

      <div>
        <label for="Password" class="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-1.5">Password</label>
        <input type="password" id="Password" name="Password" required placeholder="••••••••" class="form-input" />
      </div>

      <div class="pt-2">
        <button type="submit" class="btn-primary w-full !py-3 !text-sm">
          <i class="ph ph-sign-in text-base"></i> Sign In
        </button>
      </div>
    </form>

    <div class="mt-6 pt-6 border-t border-white/5 text-center text-xs text-zinc-400">
      Don't have an account? 
      <a href="/registration" class="text-emerald-400 hover:text-emerald-300 font-medium">Create one now</a>
    </div>
  </div>

</body>
</html>
