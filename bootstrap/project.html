<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add My Project — Wahyu Febri Tamtomo</title>
  <link rel="icon" type="image/x-icon" href="/assets/dp.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            canvas: '#09090b',
            surface: '#121215',
            'surface-elevated': '#18181b',
            emerald: {
              400: '#34d399',
              500: '#10b981',
              600: '#059669',
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="/css/modern.css">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <!-- 3D WebGL & Animation Engines -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.1/vanilla-tilt.min.js"></script>
  <script src="/script/interactive-3d.js" defer></script>
</head>
<body class="bg-canvas text-zinc-100 selection:bg-emerald-500/20 selection:text-emerald-300 relative min-h-screen">
  <div id="canvas3d-bg"></div>

  <!-- Floating Navbar -->
  <header class="fixed top-5 inset-x-0 z-50 flex justify-center px-4">
    <nav class="glass-panel rounded-full px-5 py-2.5 flex items-center gap-6 shadow-2xl shadow-black/60 max-w-4xl w-full justify-between border border-white/10">
      <a href="/" class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-emerald-500 to-teal-400 p-[1px]">
          <div class="w-full h-full bg-zinc-950 rounded-full flex items-center justify-center font-bold text-xs text-emerald-400">
            WZ
          </div>
        </div>
        <span class="text-sm font-semibold tracking-tight text-zinc-100">Wahyu Zero</span>
      </a>

      <div class="hidden md:flex items-center gap-1 text-xs font-medium text-zinc-400">
        <a href="/" class="px-3.5 py-1.5 rounded-full hover:text-zinc-100 hover:bg-white/5 transition-colors">Home</a>
        <a href="/blogs" class="px-3.5 py-1.5 rounded-full hover:text-zinc-100 hover:bg-white/5 transition-colors">Projects</a>
        <a href="/testimonial" class="px-3.5 py-1.5 rounded-full hover:text-zinc-100 hover:bg-white/5 transition-colors">Testimonials</a>
        <a href="/contact" class="px-3.5 py-1.5 rounded-full hover:text-zinc-100 hover:bg-white/5 transition-colors">Contact</a>
      </div>

      <div class="flex items-center gap-2">
        <a href="/blogs" class="btn-secondary text-xs !py-1.5 !px-3.5 !rounded-lg">
          <i class="ph ph-arrow-left"></i> Cancel
        </a>
      </div>
    </nav>
  </header>

  <main class="max-w-2xl mx-auto px-6 pt-32 pb-24 relative z-10">
    <div class="tilt-card glass-panel rounded-3xl p-6 sm:p-10 border border-white/10 shadow-2xl">
      <div class="mb-8">
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-xs font-mono mb-2">
          <i class="ph ph-plus-circle"></i> Project Studio
        </div>
        <h1 class="text-3xl font-extrabold text-zinc-100 tracking-tight">Publish New Project</h1>
        <p class="text-zinc-400 text-xs mt-1">Fill out the details below to add your engineering project to the portfolio.</p>
      </div>

      <form action="/add-post" method="POST" enctype="multipart/form-data" class="space-y-5">
        
        <!-- Title -->
        <div>
          <label for="projectName" class="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-2">Project Title</label>
          <input type="text" id="projectName" name="projectName" required placeholder="e.g. Distributed Task Orchestrator" class="w-full bg-[#121215] text-zinc-100 placeholder-zinc-500 border border-white/10 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 transition-all" />
        </div>

        <!-- Dates Grid -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label for="startDate" class="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-2">Start Date</label>
            <input type="date" id="startDate" name="startDate" required class="w-full bg-[#121215] text-zinc-100 border border-white/10 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 transition-all [color-scheme:dark]" />
          </div>
          <div>
            <label for="endDate" class="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-2">End Date</label>
            <input type="date" id="endDate" name="endDate" required class="w-full bg-[#121215] text-zinc-100 border border-white/10 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 transition-all [color-scheme:dark]" />
          </div>
        </div>

        <!-- Description / Content -->
        <div>
          <label for="konten" class="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-2">Project Description & Architecture</label>
          <textarea id="konten" name="konten" rows="5" required placeholder="Describe system architecture, challenges solved, and key features..." class="w-full bg-[#121215] text-zinc-100 placeholder-zinc-500 border border-white/10 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 transition-all resize-none"></textarea>
        </div>

        <!-- Technologies Multi-Select with Badges -->
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-3">Technologies Employed</label>
          <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
            <label class="flex items-center gap-2.5 p-3 rounded-xl bg-[#121215] border border-white/10 hover:border-emerald-500/40 cursor-pointer transition-all group">
              <input type="checkbox" name="nodeJs" id="nodeJs" class="w-4 h-4 rounded text-emerald-500 bg-zinc-900 border-zinc-700 focus:ring-emerald-500 focus:ring-offset-zinc-950">
              <span class="flex items-center gap-1.5 text-xs font-medium text-zinc-300 group-hover:text-white">
                <img src="/assets/minilogo/nodejs.png" class="w-3.5 h-3.5" alt="Node.js" /> Node.js
              </span>
            </label>
            <label class="flex items-center gap-2.5 p-3 rounded-xl bg-[#121215] border border-white/10 hover:border-emerald-500/40 cursor-pointer transition-all group">
              <input type="checkbox" name="reactJs" id="reactJs" class="w-4 h-4 rounded text-emerald-500 bg-zinc-900 border-zinc-700 focus:ring-emerald-500 focus:ring-offset-zinc-950">
              <span class="flex items-center gap-1.5 text-xs font-medium text-zinc-300 group-hover:text-white">
                <img src="/assets/minilogo/reactjs.png" class="w-3.5 h-3.5" alt="React.js" /> React.js
              </span>
            </label>
            <label class="flex items-center gap-2.5 p-3 rounded-xl bg-[#121215] border border-white/10 hover:border-emerald-500/40 cursor-pointer transition-all group">
              <input type="checkbox" name="nextJs" id="nextJs" class="w-4 h-4 rounded text-emerald-500 bg-zinc-900 border-zinc-700 focus:ring-emerald-500 focus:ring-offset-zinc-950">
              <span class="flex items-center gap-1.5 text-xs font-medium text-zinc-300 group-hover:text-white">
                <img src="/assets/minilogo/nextjs.png" class="w-3.5 h-3.5" alt="Next.js" /> Next.js
              </span>
            </label>
            <label class="flex items-center gap-2.5 p-3 rounded-xl bg-[#121215] border border-white/10 hover:border-emerald-500/40 cursor-pointer transition-all group">
              <input type="checkbox" name="typeScript" id="typeScript" class="w-4 h-4 rounded text-emerald-500 bg-zinc-900 border-zinc-700 focus:ring-emerald-500 focus:ring-offset-zinc-950">
              <span class="flex items-center gap-1.5 text-xs font-medium text-zinc-300 group-hover:text-white">
                <img src="/assets/minilogo/typescr.png" class="w-3.5 h-3.5" alt="TypeScript" /> TypeScript
              </span>
            </label>
          </div>
        </div>

        <!-- File Upload with Live Preview -->
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-2">Cover Image (Screenshot / Thumbnail)</label>
          <div class="w-full p-6 sm:p-8 border-2 border-dashed border-white/15 hover:border-emerald-500/50 rounded-2xl bg-[#121215] text-center cursor-pointer transition-all group" onclick="document.getElementById('image').click()">
            <input type="file" name="image" id="image" accept="image/*" class="hidden" onchange="previewImage(this)">
            <div id="uploadPrompt" class="flex flex-col items-center">
              <div class="w-12 h-12 rounded-2xl bg-emerald-500/10 text-emerald-400 flex items-center justify-center text-2xl mb-3 group-hover:scale-110 transition-transform">
                <i class="ph ph-cloud-arrow-up"></i>
              </div>
              <p class="text-xs font-semibold text-zinc-200">Click to upload or drag & drop</p>
              <p class="text-[10px] text-zinc-500 mt-1">PNG, JPG, WebP or SVG (max 10MB)</p>
            </div>
            <div id="previewContainer" class="hidden">
              <img id="imagePreview" src="" alt="Preview" class="max-h-48 rounded-xl mx-auto object-cover border border-white/10 shadow-2xl" />
              <p class="text-[11px] text-emerald-400 mt-2 font-mono" id="fileNameLabel"></p>
            </div>
          </div>
        </div>

        <!-- Submit Button -->
        <div class="pt-4">
          <button type="submit" class="w-full py-3.5 px-6 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-zinc-950 font-bold text-sm shadow-lg shadow-emerald-500/25 transition-all flex items-center justify-center gap-2 cursor-pointer btn-magnetic">
            <i class="ph ph-paper-plane text-base"></i> Publish Project
          </button>
        </div>

      </form>
    </div>
  </main>

  <script>
    function previewImage(input) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          document.getElementById('uploadPrompt').classList.add('hidden');
          const container = document.getElementById('previewContainer');
          container.classList.remove('hidden');
          document.getElementById('imagePreview').src = e.target.result;
          document.getElementById('fileNameLabel').textContent = input.files[0].name;
        }
        reader.readAsDataURL(input.files[0]);
      }
    }
  </script>

</body>
</html>
