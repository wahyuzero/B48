<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Get in Touch — Wahyu Febri Tamtomo</title>
  <link rel="icon" type="image/x-icon" href="/assets/dp.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            canvas: '#09090b',
            surface: '#121215',
            'surface-elevated': '#18181b',
            emerald: {
              400: '#34d399',
              500: '#10b981',
              600: '#059669',
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="/css/modern.css">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <!-- 3D WebGL & Animation Engines -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.1/vanilla-tilt.min.js"></script>
  <script src="/script/interactive-3d.js" defer></script>
</head>
<body class="bg-canvas text-zinc-100 selection:bg-emerald-500/20 selection:text-emerald-300 relative min-h-screen">
  <div id="canvas3d-bg"></div>

  <!-- Floating Navbar -->
  <header class="fixed top-5 inset-x-0 z-50 flex justify-center px-4">
    <nav class="glass-panel rounded-full px-5 py-2.5 flex items-center gap-6 shadow-2xl shadow-black/60 max-w-4xl w-full justify-between border border-white/10">
      <a href="/" class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-emerald-500 to-teal-400 p-[1px]">
          <div class="w-full h-full bg-zinc-950 rounded-full flex items-center justify-center font-bold text-xs text-emerald-400">
            WZ
          </div>
        </div>
        <span class="text-sm font-semibold tracking-tight text-zinc-100">Wahyu Zero</span>
      </a>

      <div class="hidden md:flex items-center gap-1 text-xs font-medium text-zinc-400">
        <a href="/" class="px-3.5 py-1.5 rounded-full hover:text-zinc-100 hover:bg-white/5 transition-colors">Home</a>
        <a href="/blogs" class="px-3.5 py-1.5 rounded-full hover:text-zinc-100 hover:bg-white/5 transition-colors">Projects</a>
        <a href="/testimonial" class="px-3.5 py-1.5 rounded-full hover:text-zinc-100 hover:bg-white/5 transition-colors">Testimonials</a>
        <a href="/contact" class="px-3.5 py-1.5 rounded-full text-zinc-100 bg-white/5 border border-white/10 transition-colors">Contact</a>
      </div>

      <div class="flex items-center gap-2">
        <a href="/" class="btn-secondary text-xs !py-1.5 !px-3.5 !rounded-lg">
          <i class="ph ph-house"></i> Home
        </a>
      </div>
    </nav>
  </header>

  <main class="max-w-xl mx-auto px-6 pt-32 pb-24 relative z-10">
    <div class="tilt-card glass-panel rounded-3xl p-6 sm:p-10 border border-white/10 shadow-2xl">
      <div class="text-center mb-8">
        <div class="w-12 h-12 rounded-2xl bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 flex items-center justify-center text-xl mx-auto mb-4">
          <i class="ph ph-envelope-open"></i>
        </div>
        <h1 class="text-3xl font-extrabold text-zinc-100 tracking-tight">Let's Work Together</h1>
        <p class="text-zinc-400 text-xs mt-2">Have a project, job inquiry, or question? Send a message directly.</p>
      </div>

      <form onsubmit="handleContact(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-1.5">Your Name</label>
          <input type="text" id="name" required placeholder="John Doe" class="w-full bg-[#121215] text-zinc-100 placeholder-zinc-500 border border-white/10 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 transition-all" />
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-1.5">Email Address</label>
          <input type="email" id="email" required placeholder="john@example.com" class="w-full bg-[#121215] text-zinc-100 placeholder-zinc-500 border border-white/10 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 transition-all" />
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-1.5">Phone / WhatsApp</label>
          <input type="tel" id="phone" placeholder="+62 812-3456-7890" class="w-full bg-[#121215] text-zinc-100 placeholder-zinc-500 border border-white/10 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 transition-all" />
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-1.5">Topic / Subject</label>
          <select id="subject" class="w-full bg-[#121215] text-zinc-100 border border-white/10 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 transition-all cursor-pointer">
            <option value="Freelance Project" class="bg-zinc-900 text-zinc-100">Freelance / Contract Project</option>
            <option value="Full-time Opportunity" class="bg-zinc-900 text-zinc-100">Full-time Engineering Role</option>
            <option value="Technical Collaboration" class="bg-zinc-900 text-zinc-100">Technical Collaboration</option>
            <option value="Other Inquiry" class="bg-zinc-900 text-zinc-100">Other Inquiry</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-1.5">Message</label>
          <textarea id="message" rows="4" required placeholder="Write your message here..." class="w-full bg-[#121215] text-zinc-100 placeholder-zinc-500 border border-white/10 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 transition-all resize-none"></textarea>
        </div>

        <div class="pt-2">
          <button type="submit" class="w-full py-3.5 px-6 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-zinc-950 font-bold text-sm shadow-lg shadow-emerald-500/25 transition-all flex items-center justify-center gap-2 cursor-pointer btn-magnetic">
            <i class="ph ph-paper-plane-tilt text-base"></i> Send Message
          </button>
        </div>
      </form>
    </div>
  </main>

  <script>
    function handleContact(e) {
      e.preventDefault();
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const phone = document.getElementById('phone').value;
      const subject = document.getElementById('subject').value;
      const message = document.getElementById('message').value;

      const body = `Hi Wahyu,%0D%0A%0D%0AMy Name: ${name}%0D%0AEmail: ${email}%0D%0APhone: ${phone}%0D%0A%0D%0AMessage:%0D%0A${message}`;
      window.location.href = `mailto:wahyuzeros@gmail.com?subject=${encodeURIComponent(subject)}&body=${body}`;
    }
  </script>

</body>
</html>
