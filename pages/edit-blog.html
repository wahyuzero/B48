<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Project — {{.blog.Title}}</title>
  <link rel="icon" type="image/x-icon" href="/assets/dp.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            canvas: '#09090b',
            surface: '#121215',
            'surface-elevated': '#18181b',
            emerald: {
              400: '#34d399',
              500: '#10b981',
              600: '#059669',
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="/css/modern.css">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body class="bg-canvas text-zinc-100 selection:bg-emerald-500/20 selection:text-emerald-300 relative min-h-screen">

  <div class="ambient-glow top-0 left-1/2 -translate-x-1/2"></div>

  <!-- Floating Navbar -->
  <header class="fixed top-5 inset-x-0 z-50 flex justify-center px-4">
    <nav class="glass-panel rounded-full px-5 py-2.5 flex items-center gap-6 shadow-2xl shadow-black/60 max-w-4xl w-full justify-between border border-white/10">
      <a href="/" class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-emerald-500 to-teal-400 p-[1px]">
          <div class="w-full h-full bg-zinc-950 rounded-full flex items-center justify-center font-bold text-xs text-emerald-400">
            WZ
          </div>
        </div>
        <span class="text-sm font-semibold tracking-tight text-zinc-100">Wahyu Zero</span>
      </a>

      <div class="flex items-center gap-2">
        <a href="/blog-detail/{{.blog.ID}}" class="btn-secondary text-xs !py-1.5 !px-3.5 !rounded-lg">
          <i class="ph ph-arrow-left"></i> Cancel Edit
        </a>
      </div>
    </nav>
  </header>

  <main class="max-w-2xl mx-auto px-6 pt-32 pb-24 relative z-10">
    <div class="glass-panel rounded-3xl p-6 sm:p-10 border border-white/10 shadow-2xl">
      <div class="mb-8">
        <span class="text-xs font-mono text-emerald-400 uppercase tracking-wider">Project Maintenance</span>
        <h1 class="text-3xl font-extrabold text-zinc-100 tracking-tight mt-1">Update Project</h1>
        <p class="text-zinc-400 text-xs mt-1">Modify details, timeline, or cover image for ID #{{.blog.ID}}.</p>
      </div>

      <form action="/update-blog/{{.blog.ID}}" method="POST" enctype="multipart/form-data" class="space-y-6">
        <input type="hidden" name="id" value="{{.blog.ID}}">

        <!-- Title -->
        <div>
          <label for="projectName" class="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-2">Project Title</label>
          <input type="text" id="projectName" name="projectName" value="{{.blog.Title}}" required class="form-input" />
        </div>

        <!-- Dates Grid -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label for="startDate" class="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-2">Start Date</label>
            <input type="date" id="startDate" name="startDate" value="{{.blog.StartPost.Format "2006-01-02"}}" required class="form-input" />
          </div>
          <div>
            <label for="endDate" class="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-2">End Date</label>
            <input type="date" id="endDate" name="endDate" value="{{.blog.EndPost.Format "2006-01-02"}}" required class="form-input" />
          </div>
        </div>

        <!-- Description / Content -->
        <div>
          <label for="konten" class="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-2">Project Content</label>
          <textarea id="konten" name="konten" rows="5" required class="form-input resize-none">{{.blog.Content}}</textarea>
        </div>

        <!-- Technologies Multi-Select -->
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-3">Technologies Used</label>
          <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
            <label class="flex items-center gap-2.5 p-3 rounded-xl bg-white/[0.02] border border-white/5 hover:border-emerald-500/40 cursor-pointer transition-all">
              <input type="checkbox" name="nodeJs" id="nodeJs" {{ if .blog.NodeJs }}checked{{ end }} class="w-4 h-4 rounded text-emerald-500 bg-zinc-900 border-zinc-700 focus:ring-emerald-500 focus:ring-offset-zinc-950">
              <span class="text-xs font-medium text-zinc-300">Node.js</span>
            </label>
            <label class="flex items-center gap-2.5 p-3 rounded-xl bg-white/[0.02] border border-white/5 hover:border-emerald-500/40 cursor-pointer transition-all">
              <input type="checkbox" name="reactJs" id="reactJs" {{ if .blog.ReactJs }}checked{{ end }} class="w-4 h-4 rounded text-emerald-500 bg-zinc-900 border-zinc-700 focus:ring-emerald-500 focus:ring-offset-zinc-950">
              <span class="text-xs font-medium text-zinc-300">React.js</span>
            </label>
            <label class="flex items-center gap-2.5 p-3 rounded-xl bg-white/[0.02] border border-white/5 hover:border-emerald-500/40 cursor-pointer transition-all">
              <input type="checkbox" name="nextJs" id="nextJs" {{ if .blog.NextJs }}checked{{ end }} class="w-4 h-4 rounded text-emerald-500 bg-zinc-900 border-zinc-700 focus:ring-emerald-500 focus:ring-offset-zinc-950">
              <span class="text-xs font-medium text-zinc-300">Next.js</span>
            </label>
            <label class="flex items-center gap-2.5 p-3 rounded-xl bg-white/[0.02] border border-white/5 hover:border-emerald-500/40 cursor-pointer transition-all">
              <input type="checkbox" name="typeScript" id="typeScript" {{ if .blog.TypeScript }}checked{{ end }} class="w-4 h-4 rounded text-emerald-500 bg-zinc-900 border-zinc-700 focus:ring-emerald-500 focus:ring-offset-zinc-950">
              <span class="text-xs font-medium text-zinc-300">TypeScript</span>
            </label>
          </div>
        </div>

        <!-- Current & Replace Image -->
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-2">Cover Image</label>
          
          <div class="mb-3 p-3 rounded-xl bg-zinc-900 border border-white/5 flex items-center gap-4">
            <img src="/{{.blog.Image}}" alt="Current Cover" class="w-16 h-16 rounded-lg object-cover border border-white/10" onerror="this.src='/assets/404.jpg'" />
            <div>
              <p class="text-xs text-zinc-300 font-medium">Current Image</p>
              <p class="text-[10px] text-zinc-500 font-mono">{{.blog.Image}}</p>
            </div>
          </div>

          <div class="dropzone" id="dropzoneBox" onclick="document.getElementById('image').click()">
            <input type="file" name="image" id="image" accept="image/*" class="hidden" onchange="previewImage(this)">
            <div id="uploadPrompt" class="flex flex-col items-center">
              <i class="ph ph-cloud-arrow-up text-2xl text-emerald-400 mb-1"></i>
              <p class="text-xs font-medium text-zinc-200">Click to upload new image replacement (optional)</p>
            </div>
            <div id="previewContainer" class="hidden">
              <img id="imagePreview" src="" alt="New Preview" class="max-h-36 rounded-lg mx-auto object-cover border border-white/10" />
              <p class="text-[11px] text-emerald-400 mt-2 font-mono" id="fileNameLabel"></p>
            </div>
          </div>
        </div>

        <!-- Submit Button -->
        <div class="pt-4">
          <button type="submit" class="btn-primary w-full !py-3 !text-sm">
            <i class="ph ph-check text-base"></i> Save Changes
          </button>
        </div>

      </form>
    </div>
  </main>

  <script>
    function previewImage(input) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          document.getElementById('uploadPrompt').classList.add('hidden');
          const container = document.getElementById('previewContainer');
          container.classList.remove('hidden');
          document.getElementById('imagePreview').src = e.target.result;
          document.getElementById('fileNameLabel').textContent = input.files[0].name;
        }
        reader.readAsDataURL(input.files[0]);
      }
    }
  </script>

</body>
</html>
