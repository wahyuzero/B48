<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Get in Touch — Wahyu Febri Tamtomo</title>
  <link rel="icon" type="image/x-icon" href="/assets/dp.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            canvas: '#040406',
            surface: '#0d0d12',
            emerald: {
              400: '#34d399',
              500: '#10b981',
              600: '#059669',
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            display: ['"Space Grotesk"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace']
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="/css/modern.css">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script src="https://unpkg.com/lenis@1.1.20/dist/lenis.min.js"></script>

  <!-- 3D WebGL & Animation Engines -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.1/vanilla-tilt.min.js"></script>
  <script src="/script/interactive-3d.js" defer></script>
</head>
<body class="bg-canvas text-zinc-100 selection:bg-emerald-500/20 selection:text-emerald-300 relative min-h-screen">
  <div id="canvas3d-bg"></div>


  <div class="noise-layer"></div>
  <div class="ambient-glow top-0 left-1/2 -translate-x-1/2"></div>

  <!-- Floating Glass Navbar -->
  <header class="fixed top-5 inset-x-0 z-50 flex justify-center px-4">
    <nav class="glass-panel rounded-full px-5 py-2.5 flex items-center gap-6 shadow-2xl shadow-black/80 max-w-4xl w-full justify-between border border-white/10">
      <a href="/" class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-emerald-500 to-teal-400 p-[1px]">
          <div class="w-full h-full bg-zinc-950 rounded-full flex items-center justify-center font-bold text-xs text-emerald-400">
            WZ
          </div>
        </div>
        <span class="text-sm font-semibold tracking-tight text-zinc-100 font-display">Wahyu Zero</span>
      </a>

      <div class="hidden md:flex items-center gap-1 text-xs font-medium text-zinc-400">
        <a href="/" class="px-3.5 py-1.5 rounded-full hover:text-zinc-100 hover:bg-white/5 transition-colors">Home</a>
        <a href="/blogs" class="px-3.5 py-1.5 rounded-full hover:text-zinc-100 hover:bg-white/5 transition-colors">Projects</a>
        <a href="/testimonial" class="px-3.5 py-1.5 rounded-full hover:text-zinc-100 hover:bg-white/5 transition-colors">Testimonials</a>
        <a href="/contact" class="px-3.5 py-1.5 rounded-full text-zinc-100 bg-white/5 border border-white/10 transition-colors">Contact</a>
      </div>

      <div class="flex items-center gap-2">
        <a href="/" class="btn-secondary text-xs !py-1.5 !px-3.5 !rounded-lg">
          <i class="ph ph-house"></i> Home
        </a>
      </div>
    </nav>
  </header>

  <main class="max-w-xl mx-auto px-6 pt-36 pb-24 relative z-10">
    <div class="double-bezel spotlight-card">
      <div class="double-bezel-inner p-8 sm:p-10">
        <div class="text-center mb-8">
          <div class="w-12 h-12 rounded-2xl bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 flex items-center justify-center text-xl mx-auto mb-4 shadow-lg shadow-emerald-500/10">
            <i class="ph ph-envelope-open"></i>
          </div>
          <h1 class="text-3xl font-extrabold text-zinc-100 tracking-tight font-display">Let's Work Together</h1>
          <p class="text-zinc-400 text-xs mt-2">Have a project, engineering role, or technical collaboration? Send a message directly.</p>
        </div>

        <form onsubmit="handleContact(event)" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-1.5">Your Name</label>
            <input type="text" id="name" required placeholder="John Doe" class="w-full bg-zinc-950/80 border border-white/10 rounded-xl px-4 py-3 text-sm text-zinc-100 placeholder-zinc-600 focus:outline-none focus:border-emerald-500/50 transition-colors" />
          </div>

          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-1.5">Email Address</label>
            <input type="email" id="email" required placeholder="john@example.com" class="w-full bg-zinc-950/80 border border-white/10 rounded-xl px-4 py-3 text-sm text-zinc-100 placeholder-zinc-600 focus:outline-none focus:border-emerald-500/50 transition-colors" />
          </div>

          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-1.5">Phone / WhatsApp</label>
            <input type="tel" id="phone" placeholder="+62 812-3456-7890" class="w-full bg-zinc-950/80 border border-white/10 rounded-xl px-4 py-3 text-sm text-zinc-100 placeholder-zinc-600 focus:outline-none focus:border-emerald-500/50 transition-colors" />
          </div>

          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-1.5">Topic / Subject</label>
            <select id="subject" class="w-full bg-zinc-950/80 border border-white/10 rounded-xl px-4 py-3 text-sm text-zinc-100 cursor-pointer focus:outline-none focus:border-emerald-500/50 transition-colors">
              <option value="Freelance Project">Freelance / Contract Project</option>
              <option value="Full-time Opportunity">Full-time Engineering Role</option>
              <option value="Technical Collaboration">Technical Collaboration</option>
              <option value="Other Inquiry">Other Inquiry</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-1.5">Message</label>
            <textarea id="message" rows="4" required placeholder="Write your message here..." class="w-full bg-zinc-950/80 border border-white/10 rounded-xl px-4 py-3 text-sm text-zinc-100 placeholder-zinc-600 focus:outline-none focus:border-emerald-500/50 transition-colors resize-none"></textarea>
          </div>

          <div class="pt-2">
            <button type="submit" class="btn-primary w-full !py-3 !text-sm">
              <i class="ph ph-paper-plane-tilt text-base"></i> Send Direct Email
            </button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <script src="/script/modern.js"></script>
  <script>
    function handleContact(e) {
      e.preventDefault();
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const phone = document.getElementById('phone').value;
      const subject = document.getElementById('subject').value;
      const message = document.getElementById('message').value;

      const body = `Hi Wahyu,%0D%0A%0D%0AMy Name: ${name}%0D%0AEmail: ${email}%0D%0APhone: ${phone}%0D%0A%0D%0AMessage:%0D%0A${message}`;
      window.location.href = `mailto:wahyuzeros@gmail.com?subject=${encodeURIComponent(subject)}&body=${body}`;
    }
  </script>

</body>
</html>
